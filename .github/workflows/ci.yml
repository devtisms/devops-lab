name: CI/CD - DevOps Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build e Deploy DEV
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informações do ambiente
        run: |
          echo "===== HOST ====="
          hostname

          echo "===== USUÁRIO ====="
          whoami

          echo "===== GIT ====="
          git --version

          echo "===== DOCKER ====="
          docker --version

          echo "===== PHP ====="
          php8.5 --version

          echo "===== PYTHON ====="
          python3 --version

          echo "===== NODE ====="
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node --version

          echo "===== ANSIBLE ====="
          ansible --version | head -2

      - name: Docker Build
        run: |
          docker build \
            -t devops-lab:${{ github.sha }} \
            -t devops-lab:dev \
            .

      - name: Testar imagem
        run: |
          docker run -d \
            --name devops-lab-test \
            -p 8081:80 \
            devops-lab:${{ github.sha }}

          sleep 5

          curl --fail http://localhost:8081

      - name: Remover container de teste
        if: always()
        run: |
          docker rm -f devops-lab-test 2>/dev/null || true

      - name: Deploy DEV
        run: |
          docker rm -f devops-lab-web 2>/dev/null || true

          docker run -d \
            --name devops-lab-web \
            --restart unless-stopped \
            -p 8080:80 \
            devops-lab:${{ github.sha }}

      - name: Verificar Deploy DEV
        run: |
          sleep 5

          docker ps --filter "name=devops-lab-web"

          curl --fail http://localhost:8080

          echo ""
          echo "======================================"
          echo "DEPLOY DEV REALIZADO COM SUCESSO"
          echo "======================================"
